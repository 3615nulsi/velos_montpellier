name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Installation
        run: uv pip install -r requirements_test.txt
      - name: Pytest
        run: python -m pytest -p no:cacheprovider
